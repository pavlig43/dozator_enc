<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box { fill: #f8fbff; stroke: #145da0; stroke-width: 3; rx: 14; }
    .board { fill: #e8f5e9; stroke: #287a3d; stroke-width: 4; rx: 18; }
    .title { font: 700 30px Arial, sans-serif; fill: #123; }
    .label { font: 700 21px Arial, sans-serif; fill: #123; }
    .text { font: 18px Arial, sans-serif; fill: #234; }
    .signal { fill: none; stroke: #145da0; stroke-width: 4; }
  </style>

  <text x="700" y="55" text-anchor="middle" class="title">Дозатор: меню по удержанию энкодера</text>

  <rect x="520" y="130" width="360" height="580" class="board"/>
  <text x="700" y="175" text-anchor="middle" class="title">ATmega328P</text>
  <text x="700" y="205" text-anchor="middle" class="text">логические пины Arduino</text>

  <text x="555" y="280" class="label">D9</text>
  <text x="555" y="320" class="label">D10</text>
  <text x="555" y="500" class="label">A4 / SDA</text>
  <text x="555" y="540" class="label">A5 / SCL</text>

  <text x="805" y="280" class="label">D7</text>
  <text x="805" y="320" class="label">D6</text>
  <text x="805" y="360" class="label">D5</text>
  <text x="805" y="500" class="label">D2</text>
  <text x="805" y="540" class="label">D3</text>

  <text x="600" y="640" class="label">D11 / D12 / D13</text>
  <text x="635" y="685" class="label">5V / GND</text>

  <rect x="70" y="180" width="320" height="180" class="box"/>
  <text x="230" y="225" text-anchor="middle" class="label">HX711 у весов</text>
  <text x="105" y="275" class="text">DT / DOUT → D9</text>
  <text x="105" y="315" class="text">SCK / CLK → D10</text>
  <text x="105" y="345" class="text">5V и GND</text>
  <path d="M390 270 H520" class="signal"/>
  <path d="M390 310 H520" class="signal"/>

  <rect x="70" y="430" width="320" height="160" class="box"/>
  <text x="230" y="475" text-anchor="middle" class="label">LCD 16×2 I2C</text>
  <text x="105" y="525" class="text">SDA → A4</text>
  <text x="105" y="565" class="text">SCL → A5</text>
  <path d="M390 500 H520" class="signal"/>
  <path d="M390 540 H520" class="signal"/>

  <rect x="1010" y="160" width="320" height="230" class="box"/>
  <text x="1170" y="205" text-anchor="middle" class="label">Нажимной энкодер</text>
  <text x="1045" y="255" class="text">S1 → D7</text>
  <text x="1045" y="295" class="text">S2 → D6</text>
  <text x="1045" y="335" class="text">KEY → D5</text>
  <text x="1045" y="370" class="text">Удержание 1 с → меню</text>
  <path d="M880 270 H1010" class="signal"/>
  <path d="M880 310 H1010" class="signal"/>
  <path d="M880 350 H1010" class="signal"/>

  <rect x="1010" y="450" width="320" height="170" class="box"/>
  <text x="1170" y="495" text-anchor="middle" class="label">DRV8871</text>
  <text x="1045" y="545" class="text">IN1 → D2</text>
  <text x="1045" y="585" class="text">IN2 / PWM → D3</text>
  <path d="M880 500 H1010" class="signal"/>
  <path d="M880 540 H1010" class="signal"/>

  <rect x="500" y="765" width="400" height="90" class="box"/>
  <text x="700" y="805" text-anchor="middle" class="label">RGB, общий катод</text>
  <text x="700" y="837" text-anchor="middle" class="text">R → D11, G → D12, B → D13 через 220 Ом</text>
  <path d="M700 710 V765" class="signal"/>
</svg>
