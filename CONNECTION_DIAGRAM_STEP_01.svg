<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <style>
    .box { fill: #f8fbff; stroke: #145da0; stroke-width: 3; rx: 14; }
    .board { fill: #e8f5e9; stroke: #287a3d; stroke-width: 4; rx: 18; }
    .title { font: 700 30px Arial, sans-serif; fill: #123; }
    .label { font: 700 21px Arial, sans-serif; fill: #123; }
    .text { font: 18px Arial, sans-serif; fill: #234; }
    .signal { fill: none; stroke: #145da0; stroke-width: 4; }
    .power { fill: none; stroke: #d22; stroke-width: 4; }
    .ground { fill: none; stroke: #222; stroke-width: 4; }
  </style>

  <text x="700" y="55" text-anchor="middle" class="title">Дозатор: энкодер, кнопка MENU и шнек</text>

  <rect x="520" y="170" width="360" height="650" class="board"/>
  <text x="700" y="215" text-anchor="middle" class="title">Arduino Nano</text>
  <text x="555" y="290" class="label">D2</text><text x="555" y="330" class="label">D3</text>
  <text x="555" y="390" class="label">D4</text>
  <text x="555" y="450" class="label">D5</text><text x="555" y="490" class="label">D6</text><text x="555" y="530" class="label">D7</text>
  <text x="800" y="290" class="label">D8</text><text x="800" y="330" class="label">D9</text><text x="800" y="370" class="label">D10</text>
  <text x="800" y="430" class="label">D11</text>
  <text x="555" y="610" class="label">A4 / SDA</text><text x="555" y="650" class="label">A5 / SCL</text>
  <text x="645" y="735" class="label">5V</text><text x="745" y="735" class="label">GND</text>

  <rect x="70" y="180" width="310" height="170" class="box"/>
  <text x="225" y="220" text-anchor="middle" class="label">HX711</text>
  <text x="105" y="265" class="text">SCK → D2</text><text x="105" y="305" class="text">DT → D3</text>
  <path d="M380 270 H520" class="signal"/><path d="M380 310 H520" class="signal"/>

  <rect x="70" y="390" width="310" height="120" class="box"/>
  <text x="225" y="430" text-anchor="middle" class="label">Кнопка MENU</text>
  <text x="105" y="475" class="text">D4 ↔ кнопка ↔ GND</text>
  <path d="M380 450 H520" class="signal"/>

  <rect x="70" y="570" width="310" height="170" class="box"/>
  <text x="225" y="610" text-anchor="middle" class="label">LCD 16×2 I2C</text>
  <text x="105" y="655" class="text">SDA → A4</text><text x="105" y="695" class="text">SCL → A5</text>
  <path d="M380 650 H520" class="signal"/><path d="M380 690 H520" class="signal"/>

  <rect x="1020" y="170" width="310" height="220" class="box"/>
  <text x="1175" y="210" text-anchor="middle" class="label">Энкодер, 20 щелчков</text>
  <text x="1055" y="255" class="text">S1 → D8</text><text x="1055" y="295" class="text">S2 → D9</text>
  <text x="1055" y="335" class="text">KEY → D10</text><text x="1055" y="370" class="text">+5V и GND</text>
  <path d="M880 290 H1020" class="signal"/><path d="M880 330 H1020" class="signal"/><path d="M880 370 H1020" class="signal"/>

  <rect x="1020" y="440" width="310" height="150" class="box"/>
  <text x="1175" y="480" text-anchor="middle" class="label">MOSFET</text>
  <text x="1055" y="525" class="text">PWM → D11</text><text x="1055" y="560" class="text">GND → общая земля</text>
  <path d="M880 430 H960 V515 H1020" class="signal"/>

  <rect x="1020" y="650" width="310" height="120" class="box"/>
  <text x="1175" y="695" text-anchor="middle" class="label">Двигатель шнека</text>
  <text x="1055" y="740" class="text">Питание 12 В через MOSFET</text>
  <path d="M1175 590 V650" class="power"/>

  <rect x="520" y="870" width="360" height="80" class="box"/>
  <text x="700" y="920" text-anchor="middle" class="text">RGB: D5 / D6 / D7 через 220 Ом</text>
  <path d="M620 820 V870" class="signal"/><path d="M660 820 V870" class="signal"/><path d="M700 820 V870" class="signal"/>
</svg>
